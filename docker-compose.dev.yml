version: "3"
volumes:
  mongodb_data:
    external: false
networks:
  cocoannotator:
    external: false

services:
  # frontend:
  #   container_name: annotator_client
  #   build:
  #     context: .
  #     dockerfile: ./client/Dockerfile
  #   ports:
  #     - "8080:8080"
  #   volumes:
  #     - "./client:/workspace/client"
  #   networks:
  #     - cocoannotator
  #   depends_on:
  #     - webserver
  webserver:
    container_name: annotator_webserver
    build:
      context: .
      dockerfile: ./backend/webserver/Dockerfile
    ports:
      - 5000:5000
    volumes:
      - "./backend/config:/workspace/config"
      - "./backend/webserver:/workspace/webserver"
      - "./backend/workers:/workspace/workers"
      - "./backend/database:/workspace/database"
      - "./datasets:/datasets"
      - "./models:/models"
    environment:
      - FILE_WATCHER=false
      - FLASK_APP=webserver
      - FLASK_ENV=development
      - DEBUG=false
    networks:
      - cocoannotator
    restart: always
    depends_on:
      - database
      - workers
  # webserver_get:
  #   container_name: annotator_webserver_get
  #   build:
  #     context: .
  #     dockerfile: ./backend/webserver/Dockerfile
  #   ports:
  #     - 5005:5000
  #   volumes:
  #     - "./backend/config:/workspace/config"
  #     - "./backend/webserver:/workspace/webserver"
  #     - "./backend/workers:/workspace/workers"
  #     - "./backend/database:/workspace/database"
  #     - "./datasets:/datasets"
  #     - "./models:/models"
  #   environment:
  #     - FILE_WATCHER=false
  #     - FLASK_APP=webserver
  #     - FLASK_ENV=development
  #     - DEBUG=false
  #   networks:
  #     - cocoannotator
  #   depends_on:
  #     - database
  #     - workers
  workers:
    container_name: annotator_workers
    build:
      context: .
      dockerfile: ./backend/workers/Dockerfile
    volumes:
      - "./backend/config:/workspace/config"
      - "./backend/webserver:/workspace/webserver"
      - "./backend/workers:/workspace/workers"
      - "./backend/database:/workspace/database"
      - "./datasets:/datasets"
    depends_on:
      - messageq
      - database
    ports:
      - 5555:5555
    networks:
      - cocoannotator
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G
  database:
    image: mongo:4.0
    container_name: annotator_mongodb
    environment:
      - MONGO_DATA_DIR=/data/db
      - MONGO_LOG_DIR=/dev/null
    volumes:
      - "mongodb_data:/data/db"
    ports:
      - "27017:27017"
    command: "mongod --smallfiles --logpath=/dev/null"
    restart: always
    networks:
      - cocoannotator
  messageq:
    image: rabbitmq:3
    container_name: annotator_message_q
    environment:
      - RABBITMQ_DEFAULT_USER=user
      - RABBITMQ_DEFAULT_PASS=password
    ports:
      - 5672:5672
    networks:
      - cocoannotator
  redis:
    image: redis
    container_name: annotator_redis
    ports:
      - 6379:6379
    networks:
      - cocoannotator
